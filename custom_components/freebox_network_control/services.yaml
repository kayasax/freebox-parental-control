cut_for:
  name: Cut Internet for a duration
  description: >-
    Cut a profile's Internet access for a bounded number of minutes, then
    automatically restore it (uses the Freebox override_until).
  target:
    entity:
      integration: freebox_network_control
      domain: switch
  fields:
    minutes:
      name: Minutes
      description: How long to cut Internet before automatic restore.
      required: true
      example: 30
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

allow_for:
  name: Allow Internet for a duration
  description: >-
    Temporarily allow a profile's Internet access for a bounded number of
    minutes (for instance during a scheduled cut), then automatically go back
    to the profile's schedule (uses the Freebox override_until).
  target:
    entity:
      integration: freebox_network_control
      domain: switch
  fields:
    minutes:
      name: Minutes
      description: How long to allow Internet before going back to the schedule.
      required: true
      example: 30
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

schedule_upsert:
  name: Add or update a cut schedule
  description: >-
    Create a new named cut schedule (or update an existing one when id is
    provided). Used by the bundled dashboard card.
  fields:
    id:
      name: Schedule ID
      description: Existing schedule id to update. Omit to create a new one.
      example: "a1b2c3d4"
      selector:
        text:
    name:
      name: Name
      description: Human-friendly schedule name (e.g. Weekdays, Weekend).
      required: true
      example: "Semaine"
      selector:
        text:
    profile_id:
      name: Profile ID (single, legacy)
      description: A single Freebox profile id. Prefer profile_ids for one or more.
      example: 3
      selector:
        number:
          mode: box
    profile_ids:
      name: Profile IDs
      description: One or more Freebox profile ids this schedule applies to.
      example: [1, 2, 3]
      selector:
        object:
    enabled:
      name: Enabled
      default: true
      selector:
        boolean:
    cut:
      name: Cut time
      required: true
      example: "21:00:00"
      selector:
        time:
    restore:
      name: Restore time
      required: true
      example: "07:00:00"
      selector:
        time:
    days:
      name: Days
      description: Weekdays the cut applies (mon, tue, wed, thu, fri, sat, sun).
      required: true
      example: ["mon", "tue", "wed", "thu", "fri"]
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun

schedule_delete:
  name: Delete a cut schedule
  description: Remove a cut schedule by its id. Used by the bundled card.
  fields:
    id:
      name: Schedule ID
      required: true
      example: "a1b2c3d4"
      selector:
        text:
